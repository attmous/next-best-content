<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <title>Synthetic illustration: the same 2 square meter balcony after the makeover — railing planters, a vertical herb rack, and tomato pots</title>
  <rect width="800" height="500" fill="#12160f"/>
  <!-- day sky + skyline -->
  <circle cx="660" cy="84" r="38" fill="#c9f24f" opacity="0.9"/>
  <g fill="#1a201a">
    <rect x="0" y="120" width="90" height="180"/>
    <rect x="100" y="80" width="70" height="220"/>
    <rect x="180" y="150" width="110" height="150"/>
    <rect x="300" y="100" width="60" height="200"/>
    <rect x="370" y="160" width="120" height="140"/>
    <rect x="500" y="130" width="80" height="170"/>
    <rect x="590" y="170" width="130" height="130"/>
    <rect x="730" y="110" width="70" height="190"/>
  </g>
  <!-- balcony floor -->
  <rect x="0" y="300" width="800" height="200" fill="#20241d"/>
  <g stroke="#2b3027" stroke-width="2">
    <line x1="0" y1="345" x2="800" y2="345"/>
    <line x1="0" y1="395" x2="800" y2="395"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>
  <!-- railing -->
  <line x1="20" y1="188" x2="780" y2="188" stroke="#4a5245" stroke-width="8" stroke-linecap="round"/>
  <g stroke="#343a30" stroke-width="6">
    <line x1="60" y1="192" x2="60" y2="320"/>
    <line x1="240" y1="192" x2="240" y2="312"/>
    <line x1="420" y1="192" x2="420" y2="308"/>
    <line x1="600" y1="192" x2="600" y2="316"/>
  </g>
  <!-- railing planters with greens -->
  <g>
    <rect x="80" y="168" width="170" height="46" rx="8" fill="#7a5c40"/>
    <rect x="300" y="168" width="170" height="46" rx="8" fill="#7a5c40"/>
    <g fill="#5fae57">
      <ellipse cx="110" cy="160" rx="26" ry="18"/><ellipse cx="150" cy="152" rx="30" ry="20"/>
      <ellipse cx="196" cy="158" rx="26" ry="17"/><ellipse cx="232" cy="164" rx="20" ry="14"/>
      <ellipse cx="330" cy="158" rx="26" ry="18"/><ellipse cx="372" cy="150" rx="30" ry="20"/>
      <ellipse cx="416" cy="156" rx="26" ry="17"/><ellipse cx="450" cy="164" rx="18" ry="13"/>
    </g>
    <g fill="#8fd06a">
      <ellipse cx="132" cy="148" rx="14" ry="10"/><ellipse cx="212" cy="150" rx="12" ry="9"/>
      <ellipse cx="352" cy="144" rx="14" ry="10"/><ellipse cx="434" cy="148" rx="12" ry="9"/>
    </g>
  </g>
  <!-- vertical rack (right) -->
  <g>
    <rect x="640" y="150" width="14" height="240" rx="6" fill="#4a5245"/>
    <g>
      <rect x="600" y="176" width="96" height="30" rx="7" fill="#7a5c40"/>
      <rect x="600" y="240" width="96" height="30" rx="7" fill="#7a5c40"/>
      <rect x="600" y="304" width="96" height="30" rx="7" fill="#7a5c40"/>
    </g>
    <g fill="#5fae57">
      <ellipse cx="628" cy="168" rx="20" ry="13"/><ellipse cx="668" cy="164" rx="22" ry="14"/>
      <ellipse cx="628" cy="232" rx="20" ry="13"/><ellipse cx="668" cy="228" rx="22" ry="14"/>
      <ellipse cx="628" cy="296" rx="20" ry="13"/><ellipse cx="668" cy="292" rx="22" ry="14"/>
    </g>
  </g>
  <!-- tomato pots -->
  <g>
    <path d="M110 366 h84 l-11 66 h-62 Z" fill="#8a5a3b"/>
    <path d="M250 366 h84 l-11 66 h-62 Z" fill="#8a5a3b"/>
    <g stroke="#57a04f" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M152 366 C 148 320, 160 296, 150 260"/>
      <path d="M292 366 C 288 316, 300 292, 292 252"/>
    </g>
    <g fill="#5fae57">
      <ellipse cx="128" cy="300" rx="20" ry="13"/><ellipse cx="176" cy="284" rx="22" ry="14"/>
      <ellipse cx="268" cy="292" rx="20" ry="13"/><ellipse cx="318" cy="276" rx="22" ry="14"/>
    </g>
    <g fill="#e2703d">
      <circle cx="146" cy="322" r="11"/><circle cx="168" cy="306" r="9"/>
      <circle cx="288" cy="314" r="11"/><circle cx="308" cy="298" r="9"/>
    </g>
  </g>
  <!-- herb crate center -->
  <g>
    <rect x="420" y="380" width="150" height="60" rx="8" fill="#7a5c40"/>
    <g fill="#8fd06a">
      <ellipse cx="450" cy="372" rx="20" ry="14"/><ellipse cx="492" cy="364" rx="24" ry="16"/>
      <ellipse cx="536" cy="372" rx="20" ry="14"/>
    </g>
  </g>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#2b3027" stroke-width="2"/>
</svg>
