<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <title>Synthetic illustration: sunrise watering routine — a watering can pouring over a planter beside a moisture meter</title>
  <rect width="800" height="500" fill="#12160f"/>
  <!-- sunrise -->
  <circle cx="150" cy="150" r="56" fill="#c9f24f" opacity="0.95"/>
  <g stroke="#c9f24f" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="150" y1="60" x2="150" y2="30"/>
    <line x1="82" y1="90" x2="62" y2="70"/>
    <line x1="218" y1="90" x2="238" y2="70"/>
    <line x1="52" y1="150" x2="24" y2="150"/>
  </g>
  <text x="150" y="246" font-family="Georgia, serif" font-size="24" fill="#8b8d81" text-anchor="middle">before 8 am</text>
  <!-- watering can -->
  <g>
    <path d="M430 120 h150 a18 18 0 0 1 18 18 v86 a18 18 0 0 1 -18 18 h-150 a18 18 0 0 1 -18 -18 v-86 a18 18 0 0 1 18 -18 Z" fill="#4a5245"/>
    <path d="M412 150 L340 190 l10 20 66 -28 Z" fill="#4a5245"/>
    <circle cx="342" cy="198" r="16" fill="#5a6354"/>
    <path d="M596 150 q54 26 0 78" fill="none" stroke="#4a5245" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- water drops -->
  <g fill="#7ec8e3">
    <path d="M330 236 q8 14 0 20 q-8 -6 0 -20Z"/>
    <path d="M316 262 q8 14 0 20 q-8 -6 0 -20Z"/>
    <path d="M344 264 q8 14 0 20 q-8 -6 0 -20Z"/>
    <path d="M330 292 q8 14 0 20 q-8 -6 0 -20Z"/>
  </g>
  <!-- planter receiving water -->
  <g>
    <path d="M250 340 h180 l-18 110 h-144 Z" fill="#7a5c40"/>
    <rect x="240" y="326" width="200" height="20" rx="6" fill="#8d6b4a"/>
    <g fill="#5fae57">
      <ellipse cx="292" cy="312" rx="24" ry="16"/><ellipse cx="340" cy="300" rx="28" ry="18"/>
      <ellipse cx="388" cy="314" rx="22" ry="14"/>
    </g>
  </g>
  <!-- moisture meter card -->
  <g>
    <rect x="520" y="290" width="220" height="150" rx="14" fill="#1d1e18" stroke="#3a4038" stroke-width="2"/>
    <text x="630" y="326" font-family="Georgia, serif" font-size="22" fill="#f4f3ee" text-anchor="middle">two-knuckle test</text>
    <rect x="548" y="348" width="164" height="12" rx="6" fill="#2b3027"/>
    <rect x="548" y="348" width="96" height="12" rx="6" fill="#7ec8e3"/>
    <text x="548" y="396" font-family="Georgia, serif" font-size="19" fill="#8b8d81">dry → water</text>
    <text x="548" y="424" font-family="Georgia, serif" font-size="19" fill="#8b8d81">damp → wait</text>
  </g>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#2b3027" stroke-width="2"/>
</svg>
