<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <title>Synthetic illustration: the honest failure — a bolted spinach pot with yellowed drooping leaves next to a lesson note</title>
  <rect width="800" height="500" fill="#12160f"/>
  <ellipse cx="400" cy="470" rx="360" ry="26" fill="#0d100c"/>
  <!-- wilted spinach pot -->
  <g>
    <path d="M170 320 h170 l-17 120 h-136 Z" fill="#6d523a"/>
    <rect x="160" y="306" width="190" height="20" rx="6" fill="#7f6044"/>
    <!-- bolted stem shooting up -->
    <path d="M254 306 C 250 240, 262 200, 256 140" fill="none" stroke="#a9a15a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="132" r="10" fill="#c9c56e"/>
    <!-- drooping yellowed leaves -->
    <g fill="#b3a54e">
      <path d="M250 300 q-56 6 -70 48 q46 8 70 -30 Z"/>
      <path d="M262 300 q58 8 68 52 q-48 6 -68 -34 Z"/>
    </g>
    <g fill="#8f8a45">
      <path d="M244 288 q-40 -2 -56 26 q34 10 56 -12 Z"/>
      <path d="M268 288 q42 0 54 28 q-36 8 -54 -14 Z"/>
    </g>
    <!-- aphid dots -->
    <g fill="#3f4a3a">
      <circle cx="216" cy="322" r="4"/><circle cx="228" cy="330" r="3.4"/><circle cx="206" cy="334" r="3"/>
      <circle cx="296" cy="326" r="4"/><circle cx="306" cy="334" r="3"/>
    </g>
  </g>
  <!-- lesson note card -->
  <g transform="rotate(-3 560 240)">
    <rect x="420" y="150" width="300" height="200" rx="14" fill="#f4f3ee"/>
    <g font-family="Georgia, serif" fill="#131408">
      <text x="448" y="196" font-size="26" font-weight="bold">week 6 notes</text>
      <text x="448" y="240" font-size="21">· spinach bolted (full sun)</text>
      <text x="448" y="274" font-size="21">· aphids took the mint</text>
      <text x="448" y="308" font-size="21">· move greens to shade</text>
    </g>
    <line x1="448" y1="208" x2="692" y2="208" stroke="#c9c2b4" stroke-width="2"/>
  </g>
  <!-- pin -->
  <circle cx="570" cy="146" r="10" fill="#e2703d"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#2b3027" stroke-width="2"/>
</svg>
