name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build container image
        run: docker build --tag next-best-content:ci .

      - name: Smoke-test container health
        shell: bash
        run: |
          container_id="$(
            docker run \
              --detach \
              --publish 127.0.0.1:3000:3000 \
              next-best-content:ci
          )"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for attempt in {1..30}; do
            response="$(
              curl \
                --fail \
                --silent \
                http://127.0.0.1:3000/api/health \
                || true
            )"

            if [[ "$response" == '{"status":"ok"}' ]]; then
              exit 0
            fi

            sleep 1
          done

          docker logs "$container_id"
          exit 1
